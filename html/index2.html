<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça seu cadastro!</title>
    <link rel="stylesheet" href="../css/style2.css">
</head>
<body>
    <!--Começo do cabeçalho-->
    <nav>
        <ul class="ul">
                <li>
                    <a href="index.html">Home</a>
                </li>
    <h1>Faça seu cadastro!</h1>
    </nav> 
    <!--Card de cadastro--> 
            <div class="card">
                <h1>Começe mais perto da gente!</h1>
                <form>
                    <label for="nome">Nome:</label>
                     <input type="text" id="nome" placeholder="Digite o seu nome" required>
                     <label for="email">Email:</label>
                     <input type="email" name="email" placeholder="Digite seu email"
                             autocomplete="email" required>
                      <label for="cpf">CPF:</label>
                      <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" maxlength="14" required>
                      <label for="telefone">Telefone:</label>
                      <input type="tel" id="telefone" placeholder="Digite seu telefone" required>
                      <label for="endereço">Endereço</label>
                    <input type="text" id="endereço" name="endereço" placeholder="Digite seu endereço">
                </form>
                <button><a href="#">Enviar Cadastro</a></button>
            </div>
    <!--Fim do card-->
</body>
</html>
